<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Login - Rubbish Collection Points</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        min-height: 100%;
    }

    body {
        min-height: 100vh;
        background: #0d0d0d;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .page {
        width: 100%;
        max-width: 430px;
    }

    .login-card {
        background: #171717;
        border: 1px solid #2d2d2d;
        border-radius: 14px;
        padding: 30px;
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.45);
    }

    .logo {
        width: 70px;
        height: 70px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: #25254d;
        border: 1px solid #3b3b73;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
    }

    h1 {
        margin: 0;
        text-align: center;
        font-size: 26px;
    }

    .subtitle {
        margin: 8px 0 28px;
        text-align: center;
        color: #888888;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        color: #aaaaaa;
        font-size: 13px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px 13px;
        background: #0e0e0e;
        border: 1px solid #3a3a3a;
        border-radius: 7px;
        color: #ffffff;
        font-size: 15px;
        outline: none;
    }

    input::placeholder {
        color: #555555;
    }

    input:focus {
        border-color: #5f7fff;
    }

    .login-button {
        width: 100%;
        padding: 12px;
        margin-top: 4px;
        border: none;
        border-radius: 7px;
        background: #315bdc;
        color: #ffffff;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
    }

    .login-button:hover {
        filter: brightness(1.15);
    }

    .login-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .message {
        display: none;
        margin-top: 18px;
        padding: 12px 14px;
        border-radius: 7px;
        font-size: 14px;
        line-height: 1.4;
    }

    .message.error {
        display: block;
        background: #351919;
        border: 1px solid #6b2c2c;
        color: #ff9999;
    }

    .message.success {
        display: block;
        background: #19351f;
        border: 1px solid #2c6b3a;
        color: #9cffae;
    }

    .back-link {
        display: block;
        margin-top: 22px;
        text-align: center;
        color: #888888;
        text-decoration: none;
        font-size: 14px;
    }

    .back-link:hover {
        color: #ffffff;
    }

    footer {
        margin-top: 20px;
        text-align: center;
        color: #555555;
        font-size: 12px;
    }

    @media (max-width: 500px) {
        body {
            padding: 15px;
        }

        .login-card {
            padding: 24px;
        }
    }
</style>
```

</head>

<body>

```
<div class="page">

    <main class="login-card">

        <div class="logo">
            🗑️
        </div>

        <h1>
            Teacher Login
        </h1>

        <p class="subtitle">
            Rubbish Collection Points
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                id="loginButton"
                class="login-button"
                type="submit"
            >
                Login
            </button>

        </form>


        <div
            id="message"
            class="message"
            role="alert"
        ></div>


        <a
            href="index.html"
            class="back-link"
        >
            ← Back to Scoreboard
        </a>

    </main>


    <footer>
        © 2026 Ben Rodda
    </footer>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- LOGIN SCRIPT -->

<script src="login.js"></script>
```

</body>
</html>
