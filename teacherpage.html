<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Teacher Control Panel</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            background-color: #111111;

            color: white;

            font-family: Arial, sans-serif;

            text-align: center;

            margin: 0;

        }


        /* =====================================
           LOGIN
        ====================================== */

        #loginScreen {

            max-width: 450px;

            margin: 100px auto;

            padding: 35px;

            background-color: #222222;

            border-radius: 15px;

        }


        #loginScreen input {

            width: 90%;

            padding: 13px;

            margin: 8px;

            border: none;

            border-radius: 6px;

            font-size: 16px;

        }


        .loginButton {

            background-color: #168a2a;

            color: white;

            padding: 13px 30px;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            cursor: pointer;

        }


        .loginButton:hover {

            background-color: #1aaa35;

        }


        #error {

            color: #ff4444;

            font-weight: bold;

            min-height: 20px;

        }


        /* =====================================
           TEACHER PANEL
        ====================================== */

        #teacherPanel {

            display: none;

        }


        .factions {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;

            max-width: 1100px;

            margin: 40px auto;

            padding: 20px;

        }


        .faction {

            background-color: #222222;

            border-radius: 12px;

            padding: 25px;

            border: 2px solid #444444;

        }


        .limbeck {

            border-color: green;

        }


        .laurence {

            border-color: yellow;

        }


        .moody {

            border-color: blue;

        }


        .murry {

            border-color: red;

        }


        .points {

            font-size: 42px;

            font-weight: bold;

            margin: 15px;

        }


        button {

            border: none;

            border-radius: 6px;

            padding: 11px 15px;

            margin: 5px;

            font-size: 15px;

            cursor: pointer;

        }


        .add {

            background-color: green;

            color: white;

        }


        .remove {

            background-color: red;

            color: white;

        }


        .reset {

            background-color: orange;

            color: black;

            font-weight: bold;

            padding: 14px 25px;

        }


        .logout {

            background-color: #555555;

            color: white;

        }


        .status {

            min-height: 20px;

        }


        .back {

            color: cyan;

            text-decoration: none;

        }


        /* =====================================
           LOGGING
        ====================================== */

        .logs-section {

            max-width: 1200px;

            margin: 50px auto;

            padding: 20px;

        }


        .logs-section h2 {

            margin-bottom: 20px;

        }


        .log-controls {

            display: flex;

            justify-content: center;

            gap: 10px;

            flex-wrap: wrap;

            margin-bottom: 20px;

        }


        .log-controls select {

            padding: 10px;

            background-color: #222222;

            color: white;

            border: 1px solid #555555;

            border-radius: 5px;

        }


        .log-controls button {

            background-color: #444444;

            color: white;

        }


        .log-table-container {

            overflow-x: auto;

            background-color: #1a1a1a;

            border-radius: 10px;

        }


        .log-table {

            width: 100%;

            border-collapse: collapse;

            min-width: 800px;

        }


        .log-table th {

            background-color: #000030;

            padding: 12px;

        }


        .log-table td {

            padding: 12px;

            border-bottom: 1px solid #333333;

        }


        .add-log {

            color: #44ff44;

            font-weight: bold;

        }


        .remove-log {

            color: #ff4444;

            font-weight: bold;

        }


        .reset-log {

            color: orange;

            font-weight: bold;

        }


        .no-logs {

            padding: 30px;

            color: #aaaaaa;

        }


        @media (max-width: 800px) {

            .factions {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        @media (max-width: 500px) {

            .factions {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         LOGIN SCREEN
    ====================================== -->

    <div id="loginScreen">

        <h1>
            🔒 Teacher Login
        </h1>


        <p>
            Sign in with your teacher account.
        </p>


        <input
            type="email"
            id="email"
            placeholder="Teacher Email"
            autocomplete="username"
        >


        <br>


        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >


        <br>


        <button
            class="loginButton"
            onclick="login()"
        >
            Login
        </button>


        <p id="error"></p>

    </div>



    <!-- =====================================
         TEACHER PANEL
    ====================================== -->

    <div id="teacherPanel">

        <h1>
            🔒 Teacher Points Control Panel
        </h1>


        <p>
            Logged in as:
            <b id="teacherEmail"></b>
        </p>



        <!-- =================================
             FACTION CONTROLS
        ================================== -->

        <div class="factions">


            <!-- LIMBECK -->

            <div class="faction limbeck">

                <h2 style="color: green;">
                    Limbeck
                </h2>


                <div
                    class="points"
                    id="limbeckPoints"
                >
                    0
                </div>


                <button
                    class="add"
                    onclick="changePoints('limbeck', 2)"
                >
                    +2 Points
                </button>


                <button
                    class="remove"
                    onclick="changePoints('limbeck', -2)"
                >
                    -2 Points
                </button>

            </div>



            <!-- LAURENCE -->

            <div class="faction laurence">

                <h2 style="color: yellow;">
                    Laurence
                </h2>


                <div
                    class="points"
                    id="laurencePoints"
                >
                    0
                </div>


                <button
                    class="add"
                    onclick="changePoints('laurence', 2)"
                >
                    +2 Points
                </button>


                <button
                    class="remove"
                    onclick="changePoints('laurence', -2)"
                >
                    -2 Points
                </button>

            </div>



            <!-- MOODY -->

            <div class="faction moody">

                <h2 style="color: blue;">
                    Moody
                </h2>


                <div
                    class="points"
                    id="moodyPoints"
                >
                    0
                </div>


                <button
                    class="add"
                    onclick="changePoints('moody', 2)"
                >
                    +2 Points
                </button>


                <button
                    class="remove"
                    onclick="changePoints('moody', -2)"
                >
                    -2 Points
                </button>

            </div>



            <!-- MURRY -->

            <div class="faction murry">

                <h2 style="color: red;">
                    Murry
                </h2>


                <div
                    class="points"
                    id="murryPoints"
                >
                    0
                </div>


                <button
                    class="add"
                    onclick="changePoints('murry', 2)"
                >
                    +2 Points
                </button>


                <button
                    class="remove"
                    onclick="changePoints('murry', -2)"
                >
                    -2 Points
                </button>

            </div>


        </div>



        <!-- =================================
             RESET
        ================================== -->

        <button
            class="reset"
            onclick="resetAllPoints()"
        >
            ⚠ RESET ALL POINTS
        </button>


        <p
            id="status"
            class="status"
        ></p>



        <!-- =================================
             LOGGING
        ================================== -->

        <div class="logs-section">

            <h2>
                📋 Points Activity Log
            </h2>


            <div class="log-controls">

                <select id="logFaction">

                    <option value="all">
                        All Factions
                    </option>

                    <option value="limbeck">
                        Limbeck
                    </option>

                    <option value="laurence">
                        Laurence
                    </option>

                    <option value="moody">
                        Moody
                    </option>

                    <option value="murry">
                        Murry
                    </option>

                </select>


                <select id="logAction">

                    <option value="all">
                        All Actions
                    </option>

                    <option value="ADD_POINTS">
                        Added Points
                    </option>

                    <option value="REMOVE_POINTS">
                        Removed Points
                    </option>

                    <option value="RESET">
                        Resets
                    </option>

                </select>


                <button
                    onclick="loadLogs()"
                >
                    🔄 Refresh Logs
                </button>

            </div>


            <div class="log-table-container">

                <table class="log-table">

                    <thead>

                        <tr>

                            <th>
                                Date / Time
                            </th>

                            <th>
                                Teacher
                            </th>

                            <th>
                                Action
                            </th>

                            <th>
                                Faction
                            </th>

                            <th>
                                Change
                            </th>

                            <th>
                                Before
                            </th>

                            <th>
                                After
                            </th>

                        </tr>

                    </thead>


                    <tbody id="logsBody">

                        <tr>

                            <td
                                colspan="7"
                                class="no-logs"
                            >
                                Loading logs...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>



        <!-- =================================
             LOGOUT
        ================================== -->

        <button
            class="logout"
            onclick="logout()"
        >
            Logout
        </button>


        <br>
        <br>


        <a
            class="back"
            href="index.html"
        >
            ← Public Scoreboard
        </a>

    </div>



    <!-- =====================================
         SUPABASE
    ====================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- SHARED CODE -->

    <script src="main.js"></script>


    <!-- TEACHER CODE -->

    <script src="teacher.js"></script>

</body>

</html>
